# ============================================================
#  Pioneer Car Service Center — nginx site config
#
#  SR-10 follow-up: the Express app sets security headers via helmet, but nginx
#  serves the SPA (index.html and every built asset) directly from disk, so
#  those responses never passed through Express and carried no headers at all.
#  The document that actually runs the application code was the one document
#  with no Content-Security-Policy.
# ============================================================

# ── Shared security headers ──────────────────────────────────
# Included in each server block. `always` matters: without it nginx omits the
# header on error responses, which is where it is often needed most.
#
# The CSP below is deliberately not "default-src 'self'". The app genuinely
# loads third-party code and assets at runtime, and a policy that ignores that
# would break the product rather than protect it:
#   unpkg.com            Leaflet js/css, injected at runtime by
#                        Customers.jsx and ServiceStatusPublic.jsx
#   js.stripe.com        Stripe.js, and the iframes it creates
#   fonts.googleapis.com font stylesheets imported by assets/css/theme.css
#   fonts.gstatic.com    the font files those stylesheets reference
#   *.basemaps.cartocdn.com  map tiles
#
# frame-src needs 'self' as well as Stripe: components/HtmlPreview.jsx renders
# author-supplied HTML in a srcdoc iframe, and an about:srcdoc frame is checked
# against frame-src. Without 'self' the SuperAdmin email-template and legal-page
# previews would come up blank in production.
#
# 'unsafe-inline' is required for style-src because the app sets inline style
# attributes throughout. It is NOT granted to script-src, so injected markup
# still cannot execute.
map $host $csp_policy {
    default "default-src 'self'; script-src 'self' https://unpkg.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src 'self' https://js.stripe.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 80;
    server_name workshop.pioneeruae.com 130.61.83.110;

    # ── HTTPS ──────────────────────────────────────────────────
    # This site is served over plaintext HTTP. Every request — including the
    # login POST and the Authorization header on each API call — travels in the
    # clear. Obtain a certificate and switch to the TLS block at the foot of
    # this file; HSTS is intentionally not set while the site answers on port
    # 80, because pinning browsers to HTTPS before it works locks users out.

    # Frontend (built Vite React SPA)
    root /var/www/car-workshop/frontend;
    index index.html;

    # ── Security headers ───────────────────────────────────────
    add_header Content-Security-Policy   $csp_policy            always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header X-Frame-Options           "DENY"                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(self), camera=(self), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"         always;

    # SPA routing — all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A request for a missing asset used to fall through to index.html and
    # return 200 with an HTML body. That hides real broken references, and it
    # defeats any fail2ban jail watching for 404 scans, since a scanner
    # probing /wp-login.php or /.env never produces a 404 to match on.
    location ~* \.(js|mjs|css|map|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|json|txt|xml)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # add_header inside a location replaces the inherited set, so the
        # security headers have to be repeated here.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Backend REST API proxy
    location /api/ {
        proxy_pass         http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         'upgrade';
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Socket.IO (real-time)
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Uploaded files ─────────────────────────────────────────
    # Customer-supplied files served from the application's own origin. Without
    # nosniff, a file whose bytes look like HTML can be sniffed as a document
    # and run script in this origin, with access to everything same-origin.
    # Content-Disposition: attachment makes the browser download rather than
    # render, which removes that path entirely; the CSP here is a sandbox in
    # case anything does get rendered.
    location /uploads/ {
        proxy_pass       http://127.0.0.1:4000/uploads/;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options "nosniff"    always;
        add_header Content-Disposition    "attachment" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # Never serve dotfiles — .env, .git and friends.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Increase upload size limit
    client_max_body_size 50M;

    # Do not advertise the exact nginx version.
    server_tokens off;

    # Gzip compression
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
}

# ============================================================
#  TLS — enable once a certificate exists for the domain.
#
#  With certbot:
#      sudo certbot --nginx -d workshop.pioneeruae.com
#  which rewrites this file for you. To do it by hand, uncomment below, point
#  the two ssl_certificate lines at the real files, and change the block above
#  to redirect instead of serving:
#
#      server {
#          listen 80;
#          server_name workshop.pioneeruae.com;
#          return 301 https://$host$request_uri;
#      }
#
#  Only add HSTS once HTTPS is confirmed working — it tells browsers to refuse
#  plaintext for the duration of max-age, and that is not reversible by
#  redeploying.
# ============================================================
# server {
#     listen 443 ssl http2;
#     server_name workshop.pioneeruae.com;
#
#     ssl_certificate     /etc/letsencrypt/live/workshop.pioneeruae.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/workshop.pioneeruae.com/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#     ssl_prefer_server_ciphers off;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 1d;
#
#     add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
#
#     # ... then the same root / location blocks as above ...
# }
