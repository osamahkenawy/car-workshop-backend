# ============================================================
#  car-workshop security headers — INCLUDE, do not replace
#
#  The live site already has a working Let's Encrypt TLS setup that certbot
#  wrote into /etc/nginx/sites-available/car-workshop. The full config in
#  deploy/car-workshop-nginx.conf is HTTP-only, so copying it over the live
#  file would delete the 443 server block and take HTTPS down.
#
#  Use this snippet instead. Install to:
#      /etc/nginx/snippets/car-workshop-security-headers.conf
#  and add ONE line inside the existing server block(s):
#      include /etc/nginx/snippets/car-workshop-security-headers.conf;
#
#  Note: nginx add_header does not inherit into a location that has its own
#  add_header. If the live config has add_header lines inside location blocks,
#  the include has to be repeated there too.
# ============================================================

# See deploy/car-workshop-nginx.conf for why each source is allowed. Short
# version: Leaflet from unpkg, Stripe.js, Google Fonts, and map tiles are all
# loaded at runtime, so a bare "default-src 'self'" would break the app.
# 'unsafe-inline' is granted to style-src only, never to script-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src 'self' https://js.stripe.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

add_header X-Content-Type-Options     "nosniff"                          always;
add_header X-Frame-Options            "DENY"                             always;
add_header Referrer-Policy            "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy         "geolocation=(self), camera=(self), microphone=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin"                      always;

# HSTS is safe to enable here because HTTPS is already working with a valid
# certificate (Let's Encrypt, verified). Uncomment once you are happy that
# every entry point is reachable over HTTPS — it is not quickly reversible.
# add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
