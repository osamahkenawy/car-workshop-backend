openapi: 3.0.3
info:
  title: Car Workshop Platform API
  description: |
    Multi-branch car workshop management platform.  
    **Authentication:** Most endpoints require a JWT Bearer token obtained from `/api/auth/login`.  
    Workshop-scoped routes read the workshop from the JWT payload.  
    External integrations use the `X-API-Key` header (see `/api/v1/*`).
  version: 1.0.0
  contact:
    name: Platform Support

servers:
  - url: /api
    description: Backend API base path

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    customerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Customer-portal JWT

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    WorkOrder:
      type: object
      properties:
        id:
          type: integer
        service_status_token:
          type: string
        barcode:
          type: string
        status:
          type: string
          enum: [pending, accepted, in_progress, completed, cancelled, failed]
        order_type:
          type: string
        category:
          type: string
        customer_name:
          type: string
        customer_phone:
          type: string
        customer_address:
          type: string
        payment_method:
          type: string
        total_amount:
          type: number
        scheduled_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Mechanic:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        phone:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [active, inactive, suspended]
        is_available:
          type: boolean
        rating:
          type: number
        created_at:
          type: string
          format: date-time

    Customer:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        company_name:
          type: string
        phone:
          type: string
        email:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    Vehicle:
      type: object
      properties:
        id:
          type: integer
        make:
          type: string
        model:
          type: string
        year:
          type: integer
        plate_number:
          type: string
        customer_id:
          type: integer

    Invoice:
      type: object
      properties:
        id:
          type: integer
        work_order_id:
          type: integer
        invoice_number:
          type: string
        status:
          type: string
          enum: [draft, sent, paid, overdue, cancelled]
        total_amount:
          type: number
        due_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time

    Part:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sku:
          type: string
        price:
          type: number
        quantity_in_stock:
          type: integer
        status:
          type: string

    ServiceBay:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        bay_type:
          type: string
        is_active:
          type: boolean

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Authentication and session management
  - name: Workshops
    description: Workshop registration and management
  - name: Mechanics
    description: Mechanic CRUD and location tracking
  - name: Customers
    description: Customer management
  - name: Service Bays
    description: Service bay management
  - name: Vehicles
    description: Vehicle records
  - name: Work Orders
    description: Work order lifecycle management
  - name: Parts
    description: Parts and inventory
  - name: Job Assignment
    description: Assign/unassign mechanics to work orders
  - name: Service Pricing
    description: Pricing rules and surge pricing
  - name: Service Status
    description: Real-time order status tracking
  - name: Cash Payment
    description: Cash collection and settlement
  - name: Warranty Claims
    description: Warranty claim management
  - name: Mechanic Earnings
    description: Earnings tracking and payout
  - name: Mechanic Documents
    description: Mechanic document uploads and verification
  - name: Mechanic App
    description: Mobile app endpoints for mechanics
  - name: Customer Auth
    description: Customer portal authentication
  - name: Customer Portal
    description: Customer self-service portal
  - name: Wallet
    description: Wallet and transactions
  - name: Invoices
    description: Invoice generation and management
  - name: Financial Advanced
    description: Currencies, escrow, subscriptions, payment links
  - name: Stripe
    description: Stripe billing integration
  - name: Webhooks
    description: Outbound webhook management
  - name: Reports
    description: Financial and operational reports
  - name: Stats
    description: Dashboard statistics
  - name: Settings
    description: Workshop settings, users, categories, roles
  - name: Notifications
    description: SMS, email, and push notifications
  - name: User Notifications
    description: In-app notifications for portal users
  - name: Integrations
    description: Third-party integration management
  - name: Uploads
    description: File uploads (logo, photos, signatures)
  - name: Public API
    description: Public endpoints (pricing, sign-up, contact)
  - name: Careers
    description: Job listings (public and admin)
  - name: Legal Pages
    description: Terms, privacy policy pages (public and admin)
  - name: Super Admin
    description: Platform owner administration
  - name: External API v1
    description: API-key authenticated external integration endpoints

paths:

  # ─────────────────────────────────────────────
  # AUTH
  # ─────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Login (staff / owner)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful, returns JWT token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      token:
                        type: string
                      user:
                        type: object
        '401':
          description: Invalid credentials

  /auth/mechanic-login:
    post:
      tags: [Auth]
      summary: Mechanic login (legacy)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful

  /auth/session:
    get:
      tags: [Auth]
      summary: Get current session
      responses:
        '200':
          description: Current user session data

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (clears cookie)
      responses:
        '200':
          description: Logged out

  /auth/branding:
    get:
      tags: [Auth]
      summary: Get workshop branding for login page
      security: []
      responses:
        '200':
          description: Branding config (logo, colors)

  /auth/register-workshop:
    post:
      tags: [Auth]
      summary: Register new workshop account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workshop_name, email, password]
              properties:
                workshop_name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                phone:
                  type: string
      responses:
        '201':
          description: Workshop registered

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Password reset successful

  /auth/change-password:
    put:
      tags: [Auth]
      summary: Change password (authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: Password changed

  # ─────────────────────────────────────────────
  # WORKSHOPS
  # ─────────────────────────────────────────────
  /workshops/register:
    post:
      tags: [Workshops]
      summary: Register a new workshop
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                phone:
                  type: string
                address:
                  type: string
      responses:
        '201':
          description: Workshop created

  /workshops/check-availability:
    get:
      tags: [Workshops]
      summary: Check subdomain/email availability
      security: []
      parameters:
        - in: query
          name: email
          schema:
            type: string
        - in: query
          name: subdomain
          schema:
            type: string
      responses:
        '200':
          description: Availability result

  /workshops/current:
    get:
      tags: [Workshops]
      summary: Get current workshop details
      responses:
        '200':
          description: Workshop object
    patch:
      tags: [Workshops]
      summary: Update current workshop (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Workshop updated

  /workshops/subscription:
    get:
      tags: [Workshops]
      summary: Get subscription info for current workshop
      responses:
        '200':
          description: Subscription details

  /workshops/usage:
    get:
      tags: [Workshops]
      summary: Get usage metrics for current workshop
      responses:
        '200':
          description: Usage metrics

  /workshops:
    get:
      tags: [Workshops]
      summary: List all workshops (platform owner only)
      responses:
        '200':
          description: List of workshops

  /workshops/{id}:
    get:
      tags: [Workshops]
      summary: Get workshop by ID (platform owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Workshop object
    patch:
      tags: [Workshops]
      summary: Update workshop by ID (platform owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated
    delete:
      tags: [Workshops]
      summary: Delete workshop (platform owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted

  /workshops/{id}/suspend:
    post:
      tags: [Workshops]
      summary: Suspend workshop (platform owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Suspended

  /workshops/{id}/activate:
    post:
      tags: [Workshops]
      summary: Activate workshop (platform owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Activated

  /workshops/licenses/generate:
    post:
      tags: [Workshops]
      summary: Generate license key (platform owner only)
      responses:
        '201':
          description: License key generated

  /workshops/licenses/validate:
    post:
      tags: [Workshops]
      summary: Validate a license key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key]
              properties:
                license_key:
                  type: string
      responses:
        '200':
          description: Validation result

  /workshops/licenses/activate:
    post:
      tags: [Workshops]
      summary: Activate a license key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key]
              properties:
                license_key:
                  type: string
      responses:
        '200':
          description: Activated

  # ─────────────────────────────────────────────
  # MECHANICS
  # ─────────────────────────────────────────────
  /mechanics:
    get:
      tags: [Mechanics]
      summary: List all mechanics
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: List of mechanics
    post:
      tags: [Mechanics]
      summary: Create mechanic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mechanic'
      responses:
        '201':
          description: Created

  /mechanics/live-locations:
    get:
      tags: [Mechanics]
      summary: Get live locations of all mechanics
      responses:
        '200':
          description: Array of mechanic location objects

  /mechanics/locations/live:
    get:
      tags: [Mechanics]
      summary: Get live locations (alternate path)
      responses:
        '200':
          description: Array of mechanic location objects

  /mechanics/me:
    get:
      tags: [Mechanics]
      summary: Get current mechanic profile
      responses:
        '200':
          description: Mechanic profile

  /mechanics/bulk-status:
    patch:
      tags: [Mechanics]
      summary: Bulk update mechanic status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                status:
                  type: string
      responses:
        '200':
          description: Updated

  /mechanics/sync-accounts:
    post:
      tags: [Mechanics]
      summary: Sync mechanic accounts
      responses:
        '200':
          description: Synced

  /mechanics/{id}:
    get:
      tags: [Mechanics]
      summary: Get mechanic by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Mechanic object
    put:
      tags: [Mechanics]
      summary: Update mechanic
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mechanic'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Mechanics]
      summary: Delete mechanic
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted

  /mechanics/{id}/status:
    patch:
      tags: [Mechanics]
      summary: Update mechanic status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
      responses:
        '200':
          description: Updated

  /mechanics/{id}/location:
    get:
      tags: [Mechanics]
      summary: Get mechanic current location
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Location object
    patch:
      tags: [Mechanics]
      summary: Update mechanic location (PATCH)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
      responses:
        '200':
          description: Updated
    post:
      tags: [Mechanics]
      summary: Update mechanic location (POST)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
      responses:
        '200':
          description: Updated

  /mechanics/{id}/location-history:
    get:
      tags: [Mechanics]
      summary: Get mechanic location history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Array of location history records

  /mechanics/{id}/toggle-active:
    patch:
      tags: [Mechanics]
      summary: Toggle mechanic active status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Toggled

  /mechanics/{id}/ratings:
    get:
      tags: [Mechanics]
      summary: Get mechanic ratings
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ratings list

  # ─────────────────────────────────────────────
  # CUSTOMERS
  # ─────────────────────────────────────────────
  /customers:
    get:
      tags: [Customers]
      summary: List customers
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Paginated customer list
    post:
      tags: [Customers]
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        '201':
          description: Created

  /customers/stats:
    get:
      tags: [Customers]
      summary: Customer statistics
      responses:
        '200':
          description: Stats object

  /customers/{id}:
    get:
      tags: [Customers]
      summary: Get customer by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Customer object
    put:
      tags: [Customers]
      summary: Update customer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Customers]
      summary: Delete customer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted

  /customers/{id}/toggle:
    patch:
      tags: [Customers]
      summary: Toggle customer active status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Toggled

  # ─────────────────────────────────────────────
  # SERVICE BAYS
  # ─────────────────────────────────────────────
  /service-bays:
    get:
      tags: [Service Bays]
      summary: List service bays
      responses:
        '200':
          description: List of service bays
    post:
      tags: [Service Bays]
      summary: Create service bay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceBay'
      responses:
        '201':
          description: Created

  /service-bays/{id}:
    get:
      tags: [Service Bays]
      summary: Get service bay by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Service bay object
    put:
      tags: [Service Bays]
      summary: Update service bay
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceBay'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Service Bays]
      summary: Delete service bay
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted

  # ─────────────────────────────────────────────
  # VEHICLES
  # ─────────────────────────────────────────────
  /vehicles:
    get:
      tags: [Vehicles]
      summary: List vehicles
      parameters:
        - in: query
          name: customer_id
          schema:
            type: integer
      responses:
        '200':
          description: List of vehicles
    post:
      tags: [Vehicles]
      summary: Create vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vehicle'
      responses:
        '201':
          description: Created

  /vehicles/{id}:
    get:
      tags: [Vehicles]
      summary: Get vehicle by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Vehicle object
    put:
      tags: [Vehicles]
      summary: Update vehicle
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vehicle'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Vehicles]
      summary: Delete vehicle
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted

  /vehicles/{id}/work-orders:
    get:
      tags: [Vehicles]
      summary: List work orders for a vehicle
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of work orders

  # ─────────────────────────────────────────────
  # WORK ORDERS
  # ─────────────────────────────────────────────
  /work-orders:
    get:
      tags: [Work Orders]
      summary: List work orders
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Paginated work order list
    post:
      tags: [Work Orders]
      summary: Create work order
      requestBody:
        required: true
        content:
          application/json:
            schema:
