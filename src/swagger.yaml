  # ─────────────────────────────────────────────
  # EXTERNAL API v1  (API-key authenticated)
  # ─────────────────────────────────────────────
  /v1/work_orders:
    get:
      tags: [External API v1]
      summary: List work orders (API key)
      security:
        - apiKeyAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
            maximum: 200
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: service_status_token
          schema:
            type: string
      responses:
        '200':
          description: Paginated work orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkOrder'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Invalid or missing API key
    post:
      tags: [External API v1]
      summary: Create work order (API key)
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkOrder'
      responses:
        '201':
          description: Work order created

  /v1/work_orders/{id}:
    get:
      tags: [External API v1]
      summary: Get work order by ID or token (API key)
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Numeric ID or service_status_token
      responses:
        '200':
          description: Work order with status history
        '404':
          description: Not found

  /v1/work_orders/{id}/cancel:
    patch:
      tags: [External API v1]
      summary: Cancel work order (API key)
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Cancelled

  /v1/service-status/{token}:
    get:
      tags: [External API v1]
      summary: Get service status by token (API key)
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status object

  /v1/customers:
